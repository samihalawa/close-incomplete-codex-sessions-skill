name: close-incomplete-codex-sessions-skill
description: Sweep the last N local Codex CLI sessions in parallel, push each thread to ship its highest-value remaining gain end-to-end, archive the originals, sweep any uncommitted artifacts, commit + push, and re-fire the Cloud Build pipeline if its trigger is disabled.
triggers:
